[package]
name = "mynotch"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Portable Windows notch with music, calendar and daily reminders"
publish = false
repository = "https://github.com/arwankemis/mynotch"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
# Already present transitively through `windows`; used directly for the Direct2D
# SetTransform matrix type, which the windows crate only re-exports via this crate.
windows-numerics = { version = "0.3.1", default-features = false }
windows = { version = "=0.62.2", features = [
 "Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "ApplicationModel",
 "UI_Notifications", "UI_Notifications_Management", "Data_Xml_Dom",
 "Devices_WiFi", "Networking_Connectivity",
 "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader",
 "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Memory", "Win32_System_Registry",
 "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_IO", "Win32_System_Variant", "Win32_Devices_Display",
 "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Imaging",
 "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility",
 "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D",
 "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common",
 "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_Graphics_DirectComposition",
 "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia",
 "Win32_Networking_WinHttp", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis",
 "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"
] }
zip = { version = "7.3.0", default-features = false, features = ["deflate"] }
piccolo = "0.3.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
